name: modulyn
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm env:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init}
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm env:init}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  # Одноразовый шаг перед API: роли БД (суперпользователь) и prisma migrate deploy (владелец схемы).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      NODE_ENV: production
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://modulyn_owner:${DB_OWNER_PASSWORD:?Run pnpm env:init}@db:5432/${POSTGRES_DB}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Run pnpm env:init}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Run pnpm env:init}
    command: ["sh", "-c", "node apps/api/scripts/db-roles.mjs && cd apps/api && node node_modules/prisma/build/index.js migrate deploy"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      API_PORT: 3001
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-localhost}
      # Phase 11 (E2): явные адреса выделенной установки; пусто — схема «метка + домен».
      APP_HOST: ${APP_HOST:-}
      PLATFORM_HOST: ${PLATFORM_HOST:-}
      TENANT_HOSTS: ${TENANT_HOSTS:-}
      # Phase 11 (E4): бренд установки в письмах; пусто — Modulyn.
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_COLOR: ${BRAND_COLOR:-}
      # Runtime-роль без обхода RLS; суперпользователь и владелец схемы API не передаются.
      DATABASE_URL: postgresql://modulyn_app:${DB_APP_PASSWORD:?Run pnpm env:init}@db:5432/${POSTGRES_DB}
      JWT_SECRET_TENANT: ${JWT_SECRET_TENANT:?Run pnpm env:init}
      JWT_SECRET_APP: ${JWT_SECRET_APP:?Run pnpm env:init}
      JWT_SECRET_PLATFORM: ${JWT_SECRET_PLATFORM:?Run pnpm env:init}
      PLATFORM_TOTP_KEY: ${PLATFORM_TOTP_KEY:?Run pnpm env:init}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      PUBLIC_PORT: ${HTTP_PORT:-8080}
      # API доступен только через proxy, который записывает X-Forwarded-For одним адресом клиента.
      TRUST_PROXY: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Почта (C1): локально — Mailpit внутри Compose; в production задать COMPOSE_SMTP_URL настоящего почтового сервиса.
      SMTP_URL: ${COMPOSE_SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  # Только для разработки (5.7): перехватывает все письма, наружу ничего не отправляет.
  # Письма — http://localhost:8025; SMTP для pnpm dev — 127.0.0.1:1025. Порты открыты только на этой машине.
  mailpit:
    image: axllent/mailpit:v1.27.11
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      # Next.js определяет по hostname, какой раздел показать: app / admin / компания.
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-localhost}
      APP_HOST: ${APP_HOST:-}
      PLATFORM_HOST: ${PLATFORM_HOST:-}
      TENANT_HOSTS: ${TENANT_HOSTS:-}
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_COLOR: ${BRAND_COLOR:-}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  proxy:
    image: nginx:stable-alpine
    healthcheck:
      test: ["CMD", "wget", "-q", "--header=Host: localhost", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
volumes:
  postgres_data:

