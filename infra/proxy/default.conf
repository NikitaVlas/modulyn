server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name localhost *.localhost;
    client_max_body_size 1m;
    server_tokens off;
    # Имена сервисов разрешаются через DNS Docker при каждом запросе (не один раз при старте nginx):
    # пересоздание api/web с новыми IP-адресами не ломает прокси (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3001;
    set $web_upstream http://web:3000;
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
